# Configuration pytest — runner de la suite de tests.
#
# Les tests sont écrits en `unittest.TestCase` : pytest les exécute
# NATIVEMENT (aucune réécriture). Ce qu'on gagne en passant au runner
# pytest : sortie et diffs d'échec plus lisibles, résumé des skips
# (`-ra`), `parametrize`/fixtures pour les futurs tests, et intégration
# directe d'hypothesis. `python -m unittest discover tests` reste
# fonctionnel (c'est le même code) — utile en environnement sans pytest.
#
# NB : la régénération des golden-tests passe toujours par l'exécution
# module (`python -m tests.test_render --update`,
# `python -m tests.test_section_canvas --update`), pas par pytest.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
