# Configuration mypy pour le Pénétromètre.
#
# Choix : strict sur le cœur pur + rendu PIL (bareme.py, geometry.py,
# palette.py, model.py, persistence.py, export.py, pil_render.py) —
# tout le code « métier + rendu PNG/PDF » est typé. Le reste (panes Tk,
# section_canvas, dialogs, app_*) reste hors périmètre : son uniformité
# est vérifiée par les golden-tests Tk qui détectent mieux qu'un
# type-check une régression visuelle.
#
# Exécution (cf. liste complète dans CLAUDE.md « Commandes utiles ») :
#   python -m mypy bareme.py geometry.py palette.py model.py \
#                  diagnostic.py persistence.py export.py \
#                  pil_render.py fiche_pdf.py app_recent.py \
#                  app_arbres.py app_recovery.py app_export_actions.py
#
# NB : sous mypy >= 1.20, les callbacks Tk en lambda à argument par défaut
# (pane_sondages, pane_identification) remontent « Cannot infer type of
# lambda » — bruit des stubs tkinter, neutralisé par module via
# `disable_error_code = misc` (cf. sections concernées). La liste mypy
# complète passe ainsi proprement (exit 0).

[mypy]
python_version = 3.10
# Plancher commun : tout module passé en argument doit au moins avoir
# ses fonctions annotées et ses retours non muets.
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True

# Strict sur les 4 modules purs. (Les options ci-dessous reproduisent
# l'expansion de `--strict` : si tu ajoutes un module au cœur pur,
# duplique ce bloc avec son nom.)
[mypy-bareme]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-geometry]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-palette]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-model]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-diagnostic]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-persistence]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-export]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-pil_render]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-fiche_pdf]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

# app_exports.py et app_menu.py sont la frontière Tk : `app_exports`
# orchestre les filedialogs/messagebox autour des fonctions pures de
# pil_render/export, `app_menu` câble la barre de menu. Typés mais
# moins strict (la surface Tk leak du `Any` via les stubs partiels).
[mypy-app_exports]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True

[mypy-app_menu]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True

# app_recent : magasin pur (JSON + listes), aucun couplage Tk → strict.
[mypy-app_recent]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

# app_settings : magasin pur (JSON + dict), aucun couplage Tk → strict.
[mypy-app_settings]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

# ui_fonts : échelle des polices, pur (un float + un helper) → strict.
[mypy-ui_fonts]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

# Mixins Tk de App (gestion liste d'arbres, autosave/récupération,
# actions d'export) : même régime souple que `penetrometre` et les panes
# (stubs tkinter incomplets ; la base `tk.Tk` des mixins n'existe que
# pour mypy, cf. `_MixinBase`).
[mypy-app_arbres]
disallow_incomplete_defs = True
no_implicit_optional = True

[mypy-app_recovery]
disallow_incomplete_defs = True
no_implicit_optional = True

[mypy-app_export_actions]
disallow_incomplete_defs = True
no_implicit_optional = True

# Couche Tk UI (panes, dialogs, section_canvas) : vérification de
# cohérence sans exiger le strict (stubs tkinter incomplets).
#
# `disable_error_code = misc` sur les panes à saisie en place : sous
# mypy >= 1.20, les callbacks Tk en lambda à argument par défaut (qui
# absorbent/réordonnent les args passés par Tk, ex. `lambda e, gr=g: …`)
# déclenchent « Cannot infer type of lambda » [misc] — bruit pur des
# stubs tkinter, non corrigeable par `functools.partial` ici. On
# neutralise ce seul code d'erreur, et uniquement sur ces modules.
[mypy-pane_identification]
disallow_incomplete_defs = True
no_implicit_optional = True
disable_error_code = misc

[mypy-pane_sondages]
disallow_incomplete_defs = True
no_implicit_optional = True
disable_error_code = misc

[mypy-pane_degradations]
disallow_incomplete_defs = True
no_implicit_optional = True
disable_error_code = misc

[mypy-pane_contreforts]
disallow_incomplete_defs = True
no_implicit_optional = True
disable_error_code = misc

[mypy-pane_diagnostic]
disallow_incomplete_defs = True
no_implicit_optional = True

# photo_gallery : widget Tk/PIL (vignettes). Même régime souple que les
# panes — les callbacks Tk en lambda à argument par défaut remontent
# « Cannot infer type of lambda » [misc], bruit pur des stubs tkinter.
[mypy-photo_gallery]
disallow_incomplete_defs = True
no_implicit_optional = True
disable_error_code = misc

[mypy-dialogs]
disallow_incomplete_defs = True
no_implicit_optional = True

# dialogs_settings : même pitfall que les panes ci-dessus — l'éditeur de
# barème (`ask_bareme_settings`) reconstruit ses boutons « ✕ » avec un
# callback lambda à argument par défaut (`lambda gid=eg.gid: …`).
[mypy-dialogs_settings]
disallow_incomplete_defs = True
no_implicit_optional = True
disable_error_code = misc

[mypy-section_canvas]
disallow_incomplete_defs = True
no_implicit_optional = True

[mypy-undo]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
strict_equality = True

[mypy-penetrometre]
disallow_incomplete_defs = True
no_implicit_optional = True

# openpyxl est une dépendance optionnelle sans stubs. On l'utilise dans
# un try/except pour exposer HAS_OPENPYXL ; mypy n'a pas besoin d'aller
# vérifier ses appels.
[mypy-openpyxl.*]
ignore_missing_imports = True

# Pillow (PIL) n'a pas de stubs ni de py.typed.
[mypy-PIL.*]
ignore_missing_imports = True

