# Configuration mypy pour le Pénétromètre Silvavenir.
#
# Choix : strict sur le cœur pur (bareme.py, geometry.py, palette.py,
# model.py) — modules sans dépendance Tk/PIL, qui portent la règle
# métier et sont déjà bien annotés. Le reste du code (panes Tk,
# section_canvas, pil_render, export, dialogs, app_*) reste hors
# périmètre mypy pour l'instant : son uniformité est vérifiée par les
# golden-tests Tk et PIL, qui détecteraient mieux qu'un type-check une
# régression visuelle.
#
# Exécution :
#   python -m mypy --strict bareme.py geometry.py palette.py model.py
# ou bien (sans flag — la config par-module ci-dessous suffit) :
#   python -m mypy bareme.py geometry.py palette.py model.py

[mypy]
python_version = 3.9
# Plancher commun : tout module passé en argument doit au moins avoir
# ses fonctions annotées et ses retours non muets.
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True

# Strict sur les 4 modules purs. (Les options ci-dessous reproduisent
# l'expansion de `--strict` : si tu ajoutes un module au cœur pur,
# duplique ce bloc avec son nom.)
[mypy-bareme]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-geometry]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-palette]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-model]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-persistence]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

[mypy-export]
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True
extra_checks = True

# openpyxl est une dépendance optionnelle sans stubs. On l'utilise dans
# un try/except pour exposer HAS_OPENPYXL ; mypy n'a pas besoin d'aller
# vérifier ses appels.
[mypy-openpyxl.*]
ignore_missing_imports = True
