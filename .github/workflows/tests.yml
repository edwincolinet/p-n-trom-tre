name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = plancher déclaré dans le README ; 3.12 = version
        # recommandée et utilisée localement par l'équipe Silvavenir.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances système (Xvfb + Tk)
        # Xvfb : framebuffer X virtuel pour exécuter les tests Tk en
        # headless (tests/test_section_canvas.py). python3-tk : binding
        # Tkinter (parfois absent de l'image setup-python).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Vérifier la syntaxe (compileall)
        # `compileall -l .` compile tout .py de la racine sans descendre
        # dans les sous-dossiers — plus robuste qu'une liste codée en
        # dur : tout nouveau pane_*.py est couvert automatiquement.
        # `-q` ne log que les erreurs.
        run: |
          python -m compileall -q -l .

      - name: Lint (ruff)
        run: ruff check .

      - name: Vérification de types (mypy, cœur pur uniquement)
        # Configuré dans mypy.ini : strict sur bareme, geometry,
        # palette, model. Les modules Tk/PIL restent hors périmètre
        # (golden-tests font foi pour leur correction visuelle).
        run: python -m mypy bareme.py geometry.py palette.py model.py persistence.py export.py

      - name: Suite de tests (unittest, sous Xvfb)
        # `xvfb-run -a` alloue un DISPLAY virtuel : les tests Tk
        # (test_section_canvas) s'exécutent au lieu de skipper.
        run: xvfb-run -a python -m unittest discover tests -v
