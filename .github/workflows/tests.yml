name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = plancher déclaré dans le README ; 3.12 = version
        # recommandée et utilisée localement par l'équipe Silvavenir.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Vérifier la syntaxe (py_compile)
        run: |
          python -m py_compile penetrometre.py model.py geometry.py \
            palette.py export.py pil_render.py bareme.py dialogs.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Suite de tests (unittest)
        run: python -m unittest discover tests -v
