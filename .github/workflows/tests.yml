name: tests

on:
  # Sur `main` (merges) ET sur les PR. Une branche de feature avec PR ouverte
  # ne déclenche donc qu'UN run (via `pull_request`) au lieu de deux
  # (push + pull_request) → moitié moins de runs et de notifications d'échec.
  push:
    branches: [main]
  pull_request:

# Moindre privilège : ce workflow ne fait que lire le code et exécuter des
# tests. Sans ce bloc, le GITHUB_TOKEN hérite des droits par défaut du
# dépôt (potentiellement en écriture), ce qui donne une capacité inutile
# à tout ce qui s'exécute dans le job — y compris les dépendances pip
# installées juste au-dessus.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = plancher supporté déclaré dans le README ; 3.13 = version
        # de build (bundle livré) et recommandée en développement.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances système (Xvfb + Tk)
        # Xvfb : framebuffer X virtuel pour exécuter les tests Tk en
        # headless (tests/test_section_canvas.py). python3-tk : binding
        # Tkinter (parfois absent de l'image setup-python).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Vérifier la syntaxe (compileall)
        # `compileall -l .` compile tout .py de la racine sans descendre
        # dans les sous-dossiers — plus robuste qu'une liste codée en
        # dur : tout nouveau pane_*.py est couvert automatiquement.
        # `-q` ne log que les erreurs.
        run: |
          python -m compileall -q -l .

      - name: Lint (ruff)
        run: ruff check .

      - name: Vérification de types (mypy)
        # Configuré dans mypy.ini : strict sur cœur pur + rendu PIL ;
        # souple sur la couche Tk (panes, dialogs, section_canvas).
        # Liste alignée sur celle de CLAUDE.md (« Commandes utiles ») :
        # tous les modules typés, y compris app_layout/app_reglages,
        # dialogs_shared, i18n, bareme_store, template_store, update_checker,
        # photo_gallery et dialogs_settings.
        run: >-
          python -m mypy
          bareme.py geometry.py palette.py model.py diagnostic.py
          persistence.py export.py pil_render.py fiche_pdf.py
          app_exports.py app_menu.py
          app_recent.py app_settings.py ui_fonts.py
          app_arbres.py app_recovery.py app_export_actions.py app_fichier.py
          app_layout.py app_reglages.py
          pane_identification.py pane_sondages.py pane_degradations.py
          pane_contreforts.py pane_diagnostic.py
          dialogs.py section_canvas.py
          comparaison.py comparaison_render.py
          undo.py tooltip.py aide_repliable.py
          penetrometre.py photo_gallery.py
          dialogs_settings.py dialogs_shared.py i18n.py bareme_store.py
          template_store.py update_checker.py photo_paths.py

      - name: Suite de tests (pytest, sous Xvfb)
        # `xvfb-run -a` alloue un DISPLAY virtuel : les tests Tk
        # (test_section_canvas) s'exécutent au lieu de skipper. pytest
        # exécute nativement les tests `unittest.TestCase` (cf. pytest.ini).
        run: xvfb-run -a python -m pytest tests
