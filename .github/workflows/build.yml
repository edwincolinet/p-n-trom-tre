name: Build & Release

# Déclenché sur les tags vX.Y.Z (ex: v3.6.0), ou manuellement (test d'un
# build sans créer de tag ni de Release publique — cf. job `release` plus
# bas, qui ne se déclenche que sur un push de tag).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# ──────────────────────────────────────────────────────────────────────
# SIGNATURE DE CODE — secrets à configurer dans GitHub → Settings →
# Secrets and variables → Actions :
#
# Windows (optionnel, supprime l'avertissement SmartScreen) :
#   CODESIGN_P12_BASE64   Certificat .pfx encodé en base64
#                         (cat cert.pfx | base64 | pbcopy)
#   CODESIGN_P12_PASSWORD Mot de passe du certificat
#
# macOS (recommandé — Gatekeeper bloque sans signature) :
#   APPLE_CERT_BASE64     Certificat Developer ID encodé en base64
#   APPLE_CERT_PASSWORD   Mot de passe du certificat
#   APPLE_TEAM_ID         Team ID Apple (ex. "ABC123DEF4")
#   APPLE_ID              Apple ID (email) pour la notarisation
#   APPLE_APP_PASSWORD    Mot de passe spécifique d'app Apple ID
#
# Si ces secrets sont absents, les étapes de signature sont ignorées
# et les builds sont produits non-signés (fonctionnels mais avec
# avertissement SmartScreen / blocage Gatekeeper).
# ──────────────────────────────────────────────────────────────────────

# Moindre privilège par défaut ; seul le job `release` remonte à
# `contents: write` (il crée la release GitHub). Les jobs de build, qui
# manipulent les secrets de signature, n'ont aucun droit d'écriture sur
# le dépôt.
permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────
  # Windows — installeur .exe (Inno Setup)
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    # `secrets` est INTERDIT dans un `if:` (→ « Unrecognized named-value:
    # 'secrets' » = fichier de workflow invalide, échec au démarrage). On
    # mappe les secrets en drapeaux booléens au niveau job (où `secrets`
    # EST autorisé), et les étapes testent `env.<flag> == 'true'`.
    env:
      HAS_WIN_SIGNING: ${{ secrets.CODESIGN_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Générer les icônes
        run: python build/build_icons.py

      - name: DEBUG TEMPORAIRE — diagnostic icônes/plateforme
        run: python -c "import sys, icons; print('sys.platform =', sys.platform); print('ICON_CALENDAR =', repr(icons.ICON_CALENDAR)); import tkinter; print('tk version =', tkinter.TkVersion, tkinter.Tcl().eval('info patchlevel'))"

      - name: Extraire la version
        id: version
        run: |
          $v = python build/get_version.py
          if (-not $v) { Write-Error "Version vide"; exit 1 }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build PyInstaller
        run: pyinstaller penetrometre.spec

      # Signature optionnelle — activée seulement si CODESIGN_P12_BASE64
      # est configuré dans les secrets du dépôt.
      - name: Signer l'exécutable (Windows)
        if: env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          # Décoder le certificat .pfx depuis le secret base64
          $certBytes = [Convert]::FromBase64String($env:CODESIGN_P12_BASE64)
          $certPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Localiser signtool.exe (Windows SDK, version la plus récente)
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe `
            | Sort-Object -Descending | Select-Object -First 1 -ExpandProperty FullName

          Write-Host "signtool : $signtool"

          # Signer l'exécutable principal avec horodatage RFC 3161
          & $signtool sign `
            /f  $certPath `
            /p  $env:CODESIGN_P12_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /d  "Pénétromètre — Expertise arboricole" `
            "dist\Penetrometre\Penetrometre.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item $certPath

      - name: Build installeur Inno Setup
        run: iscc /DMyAppVersion="${{ steps.version.outputs.VERSION }}" build\installer.iss

      # Signer aussi l'installeur .exe (optionnel, même secret)
      - name: Signer l'installeur Setup.exe (Windows)
        if: env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:CODESIGN_P12_BASE64)
          $certPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe `
            | Sort-Object -Descending | Select-Object -First 1 -ExpandProperty FullName

          $installer = Get-ChildItem "dist\installer\Penetrometre-*-Setup.exe" `
            | Select-Object -First 1 -ExpandProperty FullName

          & $signtool sign `
            /f  $certPath `
            /p  $env:CODESIGN_P12_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /d  "Pénétromètre — Expertise arboricole" `
            $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item $certPath

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: dist/installer/Penetrometre-*-Setup.exe

  # ──────────────────────────────────────────────
  # macOS arm64 (Apple Silicon, M1/M2/M3)
  # Pour Intel x86_64 : dupliquer ce job avec runs-on: macos-13
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    # Cf. build-windows : `secrets` interdit dans `if:` → drapeaux booléens
    # au niveau job, testés via `env.<flag>` dans les étapes.
    env:
      HAS_MAC_SIGNING: ${{ secrets.APPLE_CERT_BASE64 != '' }}
      HAS_MAC_NOTARY:  ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer Tk (requis par Tkinter)
        run: brew install python-tk@3.13

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Installer create-dmg
        run: brew install create-dmg

      - name: Générer les icônes (PNG + ICO + ICNS)
        run: python build/build_icons.py

      - name: Build PyInstaller
        run: pyinstaller penetrometre.spec

      # ── Signature macOS (optionnelle) ────────────────────────────────
      # Nécessite : APPLE_CERT_BASE64, APPLE_CERT_PASSWORD, APPLE_TEAM_ID
      # Sans ces secrets : l'app fonctionne mais Gatekeeper la bloque.
      # ─────────────────────────────────────────────────────────────────
      - name: Importer le certificat Developer ID (macOS)
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          APPLE_CERT_BASE64:    ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD:  ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PWD=$(openssl rand -hex 16)

          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/cert.p12"
          # Exporter le path du keychain pour les étapes suivantes
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD"   >> $GITHUB_ENV

      - name: Signer l'application (macOS)
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          codesign --force --deep --options runtime \
            --entitlements build/entitlements.plist \
            --sign "Developer ID Application: Edwin Colinet ($APPLE_TEAM_ID)" \
            dist/Penetrometre.app

          # Vérification
          codesign --verify --deep --strict dist/Penetrometre.app
          echo "✅ Signature macOS OK"

      - name: Créer le DMG
        run: bash build/create_dmg.sh

      # ── Notarisation Apple (optionnelle) ─────────────────────────────
      # Nécessite en plus : APPLE_ID et APPLE_APP_PASSWORD
      # ─────────────────────────────────────────────────────────────────
      - name: Notariser et agrafer (macOS)
        if: env.HAS_MAC_NOTARY == 'true'
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls dist/Penetrometre-*-macOS-*.dmg | head -1)

          # Soumettre à Apple Notary Service et attendre la validation
          xcrun notarytool submit "$DMG" \
            --apple-id     "$APPLE_ID" \
            --password     "$APPLE_APP_PASSWORD" \
            --team-id      "$APPLE_TEAM_ID" \
            --wait

          # Agrafer le ticket dans le DMG (optionnel mais recommandé)
          xcrun stapler staple "$DMG"
          echo "✅ Notarisation macOS OK : $DMG"

      - name: Nettoyer le keychain temporaire
        if: always() && env.HAS_MAC_SIGNING == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          # Le nom du fichier inclut l'architecture (arm64 ou x86_64)
          path: dist/Penetrometre-*-macOS-*.dmg

  # ──────────────────────────────────────────────
  # Linux — AppImage portable (x86_64)
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer les dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Générer les icônes (PNG + ICO)
        run: python build/build_icons.py

      - name: Build PyInstaller
        run: pyinstaller penetrometre.spec

      - name: Smoke test — vérifier que l'app démarre sans crash
        run: |
          set +e
          xvfb-run -a timeout 5 dist/Penetrometre/Penetrometre
          EC=$?
          set -e
          # 124 = timeout (app tournait encore = OK), 0 = sortie propre = OK
          [ $EC -eq 124 ] || [ $EC -eq 0 ] || (echo "Crash au démarrage (exit $EC)" && exit 1)

      - name: Créer l'AppImage
        run: bash build/create_appimage.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage
          path: dist/Penetrometre-*-linux-x86_64.AppImage

  # ──────────────────────────────────────────────
  # Publication GitHub Release
  # ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
