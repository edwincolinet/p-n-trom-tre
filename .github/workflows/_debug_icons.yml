name: Debug icons (temporaire)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Diagnostic plateforme/icônes
        run: |
          python -c "import sys, icons; print('sys.platform =', sys.platform); print('ICON_CALENDAR =', repr(icons.ICON_CALENDAR)); import tkinter; print('tk version =', tkinter.TkVersion, tkinter.Tcl().eval('info patchlevel'))"
